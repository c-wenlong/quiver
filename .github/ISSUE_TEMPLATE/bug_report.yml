# Field ids and the Area options are part of a contract: the Mac app's
# Help › Report a Bug (app/mac/Sources/QuiverCore/Support/IssueReport.swift)
# and `swe bug` (src/swe/bug.py) prefill them by name, and
# .github/workflows/issue-labels.yml maps each Area option to a label.
# Rename one and update all three.
name: Bug report
description: Report something in SWE that isn't working
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. The quickest way here is **Help › Report a Bug** in the Mac app or `swe bug` in a terminal, which fill in your versions for you.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of SWE is it?
      options:
        - Mac app
        - CLI (swe)
        - iPhone app
        - Web app
        - Website or docs
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Opening Sessions shows a blank list, though swe session lists 40 sessions.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings › Accounts
        2. Add a second Claude account
        3. The Limits page shows only the first one
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?

  - type: input
    id: version
    attributes:
      label: Version
      description: "Mac app: Settings › General › Version. CLI: `swe version`."
      placeholder: SWE 1.1.1 · swe 1.1.1
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.1
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: "Mac app: Help › Copy Diagnostics. CLI: `swe doctor` output. It catches most PATH and drift problems outright."
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Other output or screenshots
      description: Terminal output, crash logs or screenshots. Remove any tokens or paths you don't want public.
