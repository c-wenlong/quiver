name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can.

        Quiver has no `--version` flag; `pip show quiver` is the way to read the installed version.

  - type: input
    id: command
    attributes:
      label: Failing command
      description: The exact command you ran, verbatim.
      placeholder: swe session --agent claude -d 7
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: I ran `swe session` and …
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands and inputs that trigger the issue.
      placeholder: |
        1. Run `swe list`
        2. Run `swe use codex`
        3. See error …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.6 / Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`.
      placeholder: Python 3.12.8
    validations:
      required: true

  - type: input
    id: quiver
    attributes:
      label: quiver version
      description: The `Version:` line from `pip show quiver`.
      placeholder: 0.2.10
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output / logs
      description: Paste terminal output. Redact any tokens or paths you don't want to share.
      render: shell

  - type: textarea
    id: doctor
    attributes:
      label: swe doctor output
      description: Optional, but it catches most PATH and drift problems outright.
      render: shell
