# The Area field shares its id and options with bug_report.yml; see the
# note at the top of that file before renaming either.
name: Feature request
description: Suggest an idea for SWE
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? New harnesses, session parsers, providers and views are all welcome.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of SWE would it change?
      options:
        - Mac app
        - CLI (swe)
        - iPhone app
        - Web app
        - Website or docs
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like SWE to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried?
