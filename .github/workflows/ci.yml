name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR branch makes the in-flight run for that branch
# obsolete.  Cancel it instead of letting two full suites race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default: no job gets a writable GITHUB_TOKEN unless it
# asks for one.  The `coverage` job overrides this with the `id-token: write`
# it needs for Codecov's OIDC upload.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Endpoints of the supported range (requires-python = ">=3.11").
        # Since the floor moved to 3.11 there is no version-gated code left
        # in the tree at all: `tomllib` is stdlib throughout and the ISO-8601
        # salvage pass in harness/rate_limits.py behaves the same on every
        # supported interpreter.  These two legs are here to catch stdlib
        # drift across the range, not to cover a branch in our own source.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: E2e smoke test (installed binary)
        # Run commands against the installed `swe` entry point — NOT
        # PYTHONPATH=src.  This catches stale-install bugs where a new
        # module file exists in the source tree but is invisible to the
        # pip-installed binary (e.g. after switching from a non-editable
        # install).  Each command exercises a different subsystem:
        #   list      → harness registry + rate_limits + session cache
        #   aliases   → harness registry
        #   session   → session parsers + aggregator
        #   models    → models analytics
        #   skills    → skills discovery
        #   mcp list  → mcp formats + cli
        #   providers → providers registry + keys
        #   __complete → completion engine
        run: |
          export HOME="$(mktemp -d)"
          swe --help
          swe tags
          swe list
          swe aliases
          swe session
          swe models
          swe skills
          swe mcp list
          swe providers list
          swe __complete list

      - name: Run unit tests
        run: |
          export HOME="$(mktemp -d)"
          python -m unittest discover -s tests -p 'test_*.py' -v

  coverage:
    # One interpreter is enough now.  The 3.10-only arms this job used to be
    # here to measure are gone with the floor bump, so coverage no longer
    # varies by version: the job's product is the fail_under gate in
    # .coveragerc plus the Codecov upload, and the suite it measures is
    # already run on both endpoints by `test`.
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install package and coverage tooling
        run: pip install -e ".[test]"

      - name: Run coverage audit
        run: |
          export HOME="$(mktemp -d)"
          python -m coverage run -m unittest discover -s tests -p 'test_*.py'
          python -m coverage combine
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-3.13
          name: python-3.13
          # Coverage reporting is a nice-to-have. Codecov being unreachable
          # should not mark a run red when every test job passed.
          fail_ci_if_error: false

  package:
    name: Built wheel smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Build wheel
        run: |
          python3 -m pip install build
          python3 -m build --wheel

      - name: Install and exercise wheel in isolation
        run: |
          python3 -m venv /tmp/quiver-wheel
          /tmp/quiver-wheel/bin/pip install dist/quiver-*.whl
          test_home="$(mktemp -d)"
          cd /tmp
          HOME="$test_home" /tmp/quiver-wheel/bin/swe --help
          HOME="$test_home" /tmp/quiver-wheel/bin/swe session --help
          HOME="$test_home" /tmp/quiver-wheel/bin/swe config --help
          HOME="$test_home" /tmp/quiver-wheel/bin/swe report --help

  nix:
    name: Nix flake build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Build the package (runs the unittest suite in the sandbox)
        run: nix build --print-build-logs

      - name: Exercise the built binary
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" ./result/bin/swe --help
          HOME="$test_home" ./result/bin/swe init --check

      - name: nix flake check
        run: nix flake check --print-build-logs

  macos-smoke:
    # Kept deliberately.  The source hardcodes Darwin-only locations that no
    # Linux runner can ever reach: the Claude Desktop config under
    # ~/Library/Application Support (mcp/cli.py), the Cursor state.vscdb path
    # and libcrypto.dylib (harness/rate_limits.py), and the Homebrew npm probe
    # in harness/path_health.py — the very module this job's test covers.
    name: macOS path and entry-point smoke test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python3 -m pip install -e .

      - name: Exercise macOS-sensitive paths
        run: |
          python3 -m unittest discover -s tests -p 'test_path_health.py' -v
          test_home="$(mktemp -d)"
          HOME="$test_home" swe --help
          HOME="$test_home" swe session --help
