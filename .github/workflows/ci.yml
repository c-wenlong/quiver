name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR branch makes the in-flight run for that branch
# obsolete.  Cancel it instead of letting two full suites race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege by default: no job gets a writable GITHUB_TOKEN unless it
# asks for one.  The `coverage` job overrides this with the `id-token: write`
# it needs for Codecov's OIDC upload.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
permissions:
  contents: read

# This workflow checks a change, and only what is fast enough to check a
# change: the Linux unittest shards, the coverage gate and the
# editable-install e2e.  It is the fast lane on purpose — a PR needs to
# turn green in minutes because agent turns poll CI to completion.
#
# The native lane moved off this path (issue #749): the macOS app unit
# tests, the macOS install smoke test and the Nix derivation build now
# run in native.yml (nightly on main, on merge_group, on demand) and
# again on every `v*` tag in release.yml, which builds and verifies the
# shipping artifacts (wheel, Nix derivation, Quiver.app and its DMG).

env:
  # How many jobs each interpreter's suite is split across.  Must match the
  # length of `matrix.shard` below.
  TEST_SHARDS: 2

jobs:
  test:
    name: test (${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One red shard should not cancel the other and hide its failures.
      fail-fast: false
      matrix:
        # Endpoints of the supported range (requires-python = ">=3.11").
        # Since the floor moved to 3.11 there is no version-gated code left
        # in the tree at all: `tomllib` is stdlib throughout and the ISO-8601
        # salvage pass in harness/rate_limits.py behaves the same on every
        # supported interpreter.  These two legs are here to catch stdlib
        # drift across the range, not to cover a branch in our own source.
        #
        # The 3.13 leg runs the suite under coverage instead of plainly, so
        # the suite runs once per interpreter rather than twice on 3.13.
        python-version: ["3.11", "3.13"]
        # 1-based; scripts/run_test_shard.py takes every TEST_SHARDS-th case.
        shard: [1, 2]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          # The core is stdlib-only, so this only saves the build backend
          # and coverage downloads; keyed on pyproject.toml.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and coverage tooling
        run: pip install -e ".[test]"

      - name: E2e smoke test (installed binary)
        # Run commands against the installed `swe` entry point — NOT
        # PYTHONPATH=src.  This catches stale-install bugs where a new
        # module file exists in the source tree but is invisible to the
        # pip-installed binary (e.g. after switching from a non-editable
        # install).  Each command exercises a different subsystem:
        #   list      → harness registry + rate_limits + session cache
        #   aliases   → harness registry
        #   session   → session parsers + aggregator
        #   models    → models analytics
        #   skills    → skills discovery
        #   mcp list  → mcp formats + cli
        #   providers → providers registry + keys
        #   __complete → completion engine
        # Once per interpreter is enough, so only the first shard runs it.
        if: ${{ matrix.shard == 1 }}
        run: |
          export HOME="$(mktemp -d)"
          swe --help
          swe tags
          swe list
          swe aliases
          swe session
          swe models
          swe skills
          swe mcp list
          swe providers list
          swe __complete list
          mkdir -p "$HOME/.quiver/AGENTS_MD"
          printf 'rules.md\n' > "$HOME/.quiver/AGENTS_MD/index.txt"
          printf '# Test instructions\n\nKeep changes small.\n' > "$HOME/.quiver/AGENTS_MD/rules.md"
          swe instructions build
          swe instructions check
          swe instructions build

      - name: Run unit tests
        if: ${{ matrix.python-version != '3.13' }}
        run: |
          export HOME="$(mktemp -d)"
          python scripts/run_test_shard.py $(( ${{ matrix.shard }} - 1 )) "$TEST_SHARDS"

      - name: Run unit tests under coverage
        # Raw data only; the `coverage` job combines every shard's files
        # and applies the fail_under gate.
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          export HOME="$(mktemp -d)"
          python -m coverage run scripts/run_test_shard.py $(( ${{ matrix.shard }} - 1 )) "$TEST_SHARDS"

      - name: Upload this shard's coverage data
        if: ${{ matrix.python-version == '3.13' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: .coverage.*
          # The data files are dotfiles, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # The fail_under gate in .coveragerc plus the Codecov upload, over the
    # combined data of every 3.13 shard.
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and coverage tooling
        run: pip install -e ".[test]"

      - name: Download every shard's coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine and report
        run: |
          python -m coverage combine
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python-3.13
          name: python-3.13
          # Coverage reporting is a nice-to-have. Codecov being unreachable
          # should not mark a run red when every test job passed.
          fail_ci_if_error: false
