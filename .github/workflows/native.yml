# The native lane: slow platform builds that used to sit on the PR path.
#
# ci.yml keeps only the fast Linux checks so a PR turns green in minutes —
# agents polling CI turned the 10-minute macOS app build into hours of
# blocked turns (issue #749).  The jobs below are the ones that moved:
# they still run nightly on main, on a merge_group request if the merge
# queue ever gates on them, and on demand, so main stays covered without
# a macOS runner standing in front of every PR.  Release tags exercise
# the same ground through release.yml, which verifies the wheel on macOS,
# builds SWE.app and runs the Nix derivation before anything attaches.
name: Native

on:
  schedule:
    # Nightly on the default branch, off the top of the hour.
    - cron: "33 4 * * *"
  merge_group:
  workflow_dispatch:

# Queue rather than race: a dispatch landing during the nightly run waits
# instead of doubling up macOS runners on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos-smoke:
    # Kept deliberately.  The source hardcodes Darwin-only locations that no
    # Linux runner can ever reach: the Claude Desktop config under
    # ~/Library/Application Support (mcp/cli.py), the Cursor state.vscdb path
    # and libcrypto.dylib (harness/rate_limits.py), and the Homebrew npm probe
    # in harness/path_health.py — the very module this job's test covers.
    name: macOS path and entry-point smoke test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python3 -m pip install -e .

      - name: Exercise macOS-sensitive paths
        run: |
          python3 -m unittest discover -s tests -p 'test_path_health.py' -v
          test_home="$(mktemp -d)"
          HOME="$test_home" swe --help
          HOME="$test_home" swe session --help

  app:
    # The SwiftPM package under app/mac/ targets macOS 26, so it needs the
    # macOS 26 image and its Xcode; macos-latest may still be older.
    # Unit tests only: bundling, the launch smoke test and the DMG run in
    # release.yml's macos-app job on a tag.
    name: macOS app unit tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: app/mac

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SwiftPM
        # .build carries the incremental build products; the shared module
        # cache under ~/Library/Caches holds the fetched dependencies.
        # Keyed on the manifest and resolved pins, with a prefix fallback
        # so a dependency bump still reuses compiled products.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            app/mac/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('app/mac/Package.swift', 'app/mac/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        # The suite has frozen on these runners for hours (the nightly of
        # 2026-10-26 ran into the 6-hour limit). test.sh stops a run still
        # going after 10 minutes and prints its thread stacks first.
        timeout-minutes: 25
        run: script/test.sh

  ios-unit:
    # The iPhone app's unit tests had no job at all. The UI test target
    # needs a paired hub, so only SWERemoteTests runs here, on the
    # first available iPhone simulator of the image's Xcode.
    name: iOS app unit tests
    runs-on: macos-26
    defaults:
      run:
        working-directory: app/ios

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        timeout-minutes: 30
        run: |
          # An iPhone on the newest iOS runtime: older runtimes' devices
          # can be listed as available with their runtime gone.
          udid="$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime.iOS-")))
            | sort_by(.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)")
                | [(.a | tonumber), (.b | tonumber)])
            | last | .value | map(select(.name | startswith("iPhone")))
            | .[0].udid')"
          test -n "$udid" && [ "$udid" != null ]
          xcodebuild -project SWERemote.xcodeproj -scheme SWERemote \
            -destination "id=$udid" -derivedDataPath build-sim \
            -only-testing:SWERemoteTests test

  nix:
    # Same derivation check release.yml runs on a tag.  Here it keeps the
    # flake honest on main: its checkPhase runs the unittest suite in the
    # sandbox, too slow for the PR lane but cheap enough nightly.
    name: Nix flake build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the package (runs the unittest suite in the sandbox)
        run: nix build --print-build-logs

      - name: Exercise the built binary
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" ./result/bin/swe --help
          HOME="$test_home" ./result/bin/swe init --check

      - name: nix flake check
        run: nix flake check --print-build-logs
