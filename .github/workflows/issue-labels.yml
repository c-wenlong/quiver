name: Issue labels

# Adds the area label (mac, cli, ios, web, documentation) that matches an
# issue form's Area answer. The forms add bug or enhancement and
# needs-triage themselves.
on:
  issues:
    types: [opened, edited]

# One run per issue at a time, in order: an open and a quick edit must not
# both add a label before either can see the other's.
concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  area:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      # The script reads the body itself, so nothing a reporter types is
      # ever part of the workflow's own text.
      - name: Label by Area
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/issue_labels.py
