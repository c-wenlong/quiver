# Release pipeline.
#
# Builds an sdist and a wheel from a `v*` tag, checks the metadata renders,
# and attaches both files to the matching GitHub release.  The `macos-app`
# job builds SWE.app on a macOS 26 runner, signs and notarizes it when
# the secrets below are configured, and attaches the DMG plus a Sparkle
# `appcast.xml` the same way.  `bump-homebrew-tap` then points the
# c-wenlong/homebrew-quiver cask and formula at the new DMG and wheel.
#
# It does NOT create the release and it does NOT merge or tag anything: the
# maintainer publishes the release by hand, and this workflow only attaches
# artifacts to it.  Run order is therefore: push the tag, write the release,
# then this job (re-run it if the release did not exist yet when the tag
# landed).
#
# A manual run takes the tag as a required `tag` input rather than inferring it
# from whatever branch the dispatch came from.  Both entry points collapse to
# one `RELEASE_TAG`, which is the ref that gets checked out, version-checked and
# attached to — so a dispatch does the same work as a tag push instead of
# quietly skipping half of it.
#
# PyPI publishing is written out below but commented off.  See the note above
# the `publish-to-pypi` job.
name: Release

on:
  push:
    tags:
      - "v*"
  # Lets the maintainer rebuild and re-attach after publishing the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and attach, e.g. v0.2.10"
        required: true
        type: string

permissions:
  contents: read

env:
  # One tag for the whole workflow: the dispatch input when there is one, the
  # pushed tag otherwise.  `inputs.tag` is empty on a push event, so the `||`
  # falls through to `github.ref_name`, which is the bare tag name there.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check the release tag looks like a version tag
        # Fails before checkout so a typo in the dispatch input says so plainly
        # rather than dying on a missing ref.
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]'; then
            echo "::error::Release tag '$RELEASE_TAG' must look like v<version>, e.g. v0.2.10"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified on purpose.  A bare name can resolve to a branch
          # that happens to share it, and the version check below would not
          # notice; `refs/tags/` can only ever mean the tag.  On a tag push
          # this equals `github.ref`, so both entry points check out the same
          # thing.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          # Full history: the Python job only builds dists, but the macOS
          # app job joins this workflow and `git describe --tags` in
          # app/mac/script/build-app.sh needs every tag; depth 1 stamps 0.0.0.
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python3 -m pip install --upgrade build twine

      - name: Check the tag matches the version in pyproject.toml
        # A tag that disagrees with `project.version` ships a file whose name
        # does not match the release it hangs off.  pyproject has run ahead of
        # the tag before, so this is a real guard, not a formality.
        run: |
          tag="${RELEASE_TAG#v}"
          declared="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag pyproject=$declared"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml version $declared"
            exit 1
          fi

      - name: Build
        run: python3 -m build

      - name: Check the built metadata
        run: python3 -m twine check --strict dist/*

      - name: Install the built wheel and run it
        # From /tmp, so the checkout's src/ can not stand in for a module
        # the wheel forgot to package.
        run: |
          python3 -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install dist/swe-*.whl
          test_home="$(mktemp -d)"
          cd /tmp
          HOME="$test_home" /tmp/relcheck/bin/swe --help
          HOME="$test_home" /tmp/relcheck/bin/swe list
          HOME="$test_home" /tmp/relcheck/bin/swe session --help
          HOME="$test_home" /tmp/relcheck/bin/swe config --help
          HOME="$test_home" /tmp/relcheck/bin/swe report --help

      - name: Upload the distributions as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  macos-app:
    # Runs beside `build`, not after it: the app shares only the tag with
    # the Python dists, so a wheel failure should not hold up a 10-minute
    # Swift build.  `attach-to-release` still gates on both.
    name: Build, sign and notarize the macOS app
    runs-on: macos-26
    # A healthy run fits well inside an hour. Without a cap a hang burns
    # GitHub's 6-hour job limit (v1.1.0 and v1.1.1 both did); the
    # per-step limits below fail the stuck step sooner still.
    timeout-minutes: 90
    #
    # Required secrets (repo Settings -> Secrets and variables -> Actions):
    #   MACOS_CERTIFICATE            base64 of the .p12 export of the
    #                                "Developer ID Application" certificate
    #                                (Keychain Access -> export with the
    #                                private key; base64 -i cert.p12)
    #   MACOS_CERTIFICATE_PASSWORD   the .p12 export password
    #   KEYCHAIN_PASSWORD            password for the throwaway CI keychain;
    #                                any string, lives only inside the run
    #   NOTARY_KEY                   base64 of the App Store Connect API
  #                                key's .p8 file (base64 -i AuthKey_*.p8)
  #   NOTARY_KEY_ID                the key's ID, e.g. ABCDEFGHIJ
  #   NOTARY_ISSUER                the issuer UUID from App Store Connect ->
  #                                Integrations -> App Store Connect API
  #   SPARKLE_PRIVATE_KEY          the EdDSA private key matching the app's
  #                                SUPublicEDKey (Sparkle bin/generate_keys
  #                                -x private-key.txt exports it)
  # Optional repository variable:
    #   SIGNING_IDENTITY             explicit codesign identity, e.g.
    #                                "Developer ID Application: Name (TEAMID)";
    #                                defaults to whatever MACOS_CERTIFICATE
    #                                imported
    #
    # With no MACOS_CERTIFICATE the job still compiles the prod bundle
    # ad-hoc (`QUIVER_SIGN_IDENTITY=-`), which keeps the scaffold honest
    # before the secrets exist; make-dmg.sh still runs, but to a scratch
    # path, so signing, notarization and the release upload stay off.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same fully-qualified tag ref as the build job.  Full history:
          # build-app.sh stamps versions from `git describe`, which reads
          # 0.0.0 on a shallow checkout.
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Cache SwiftPM
        # .build carries the incremental build products; the shared module
        # cache under ~/Library/Caches holds the fetched dependencies.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            app/mac/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('app/mac/Package.swift', 'app/mac/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-

      - name: Toolchain
        run: swift --version

      - name: Unit tests
        # The `app` job moved off ci.yml's PR path (issue #749); the tag
        # build runs the Swift suite here instead, before any signing
        # setup, so a test failure fails fast and blocks the release.
        # The suite takes about 5 minutes; v1.1.0 hung here for 4 hours
        # with ~90 tests started and none finishing. test.sh stops a run
        # that is still going after 10 minutes and prints its thread
        # stacks first, so a hang names what blocked.
        timeout-minutes: 25
        run: app/mac/script/test.sh

      - name: Import the signing certificate
        id: cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::notice::MACOS_CERTIFICATE is not set; building the app ad-hoc. Signing, notarization and release upload are skipped."
            echo "have_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/swe-signing.keychain-db"
          p12="$RUNNER_TEMP/swe-cert.p12"
          # The secret is the base64 text of the exported .p12.
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode -o "$p12"
          # A throwaway keychain keeps the release private key out of the
          # runner's login keychain and lets the cleanup step drop it whole.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          # A new keychain locks itself after 300 s idle. The app build
          # reaches its first codesign about 6 minutes after this step, so
          # codesign found the keychain locked and sat on an unlock dialog
          # no one could answer until the 6-hour limit (v1.1.1). Six hours
          # covers the whole job.
          security set-keychain-settings -lut 21600 "$keychain"
          # Make it the default and put it on the search list so codesign
          # and find-identity find the identity, and unlock it so no later
          # step hits a locked-keychain failure.
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          # Import cert + private key; -T grants codesign access to it.
          security import "$p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # The partition list is what lets codesign use the key
          # non-interactively; without it signing fails with "User
          # interaction is not allowed" on a headless runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          rm -f "$p12"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE did not contain a 'Developer ID Application' identity."
            exit 1
          fi
          echo "sign_identity=$identity" >> "$GITHUB_OUTPUT"
          echo "have_cert=true" >> "$GITHUB_OUTPUT"

      - name: Build SWE.app
        env:
          SWE_CHANNEL: prod
          # An explicit SIGNING_IDENTITY variable wins, then the identity
          # the certificate step imported, then `-`: the forced ad-hoc
          # signature that lets this job validate the prod build before
          # the secrets exist.  With no identity at all a prod build fails
          # loudly inside build-app.sh, so `-` keeps the scaffold green.
          SWE_SIGN_IDENTITY: ${{ vars.SIGNING_IDENTITY || steps.cert.outputs.sign_identity || '-' }}
        # About 6 minutes of compiling, then signing every Mach-O.
        timeout-minutes: 30
        run: app/mac/script/build-app.sh release

      - name: Report the signature
        # Shows in the log what the bundle was actually signed with; the
        # unsigned scaffold run prints "Signature=adhoc" here.
        run: codesign -dvvv app/mac/build/SWE.app || true

      - name: Smoke-test the bundled app
        # Exercises the bundle end to end, post-signing, against a
        # throwaway HOME: the embedded swe (the build-time probe ran
        # before codesign touched it), then the GUI binary itself.
        timeout-minutes: 5
        run: |
          test_home="$(mktemp -d)"
          swe="app/mac/build/SWE.app/Contents/Resources/swe/bin/swe"
          HOME="$test_home" "$swe" --help >/dev/null
          HOME="$test_home" "$swe" version --json
          # A GUI app that is still alive after 20 s has loaded its
          # frameworks, Python and signature fine. A zombie child still
          # answers kill -0, so check the process state before reaping.
          HOME="$test_home" app/mac/build/SWE.app/Contents/MacOS/SWE &
          pid=$!
          sleep 20
          case "$(ps -o stat= -p "$pid" 2>/dev/null)" in
            ""|*Z*)
              if wait "$pid"; then status=0; else status=$?; fi
              if [ "$status" -ne 0 ]; then
                echo "::error::SWE.app exited $status within 20 s of launch"
                exit 1
              fi
              echo "SWE.app exited cleanly before the timeout"
              ;;
            *)
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              echo "SWE.app launched and stayed up"
              ;;
          esac

      - name: Notarize, sign and package the DMG
        # One script owns the whole post-build path: staple the .app,
        # stage the image, sign the DMG, submit it and staple it. The
        # same script runs locally; this step just hands it the CI
        # credential form.
        if: steps.cert.outputs.have_cert == 'true'
        # Two notarytool submissions with --wait (the app, then the
        # DMG); Apple usually answers each in a few minutes.
        timeout-minutes: 45
        env:
          SWE_SIGN_IDENTITY: ${{ vars.SIGNING_IDENTITY || steps.cert.outputs.sign_identity }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          mkdir -p app/mac/build/macos-app
          app/mac/script/make-dmg.sh app/mac/build/SWE.app \
            "app/mac/build/macos-app/SWE-${RELEASE_TAG#v}.dmg"
          ls -lh app/mac/build/macos-app/

      - name: Exercise the DMG path on the unsigned build
        # No certificate: the release DMG stays off, but make-dmg.sh still
        # runs end-to-end ad-hoc so a broken script shows up on the tag
        # build rather than on the first signed release. The image goes
        # to RUNNER_TEMP, never into the artifact, so an unsigned DMG can
        # not reach a release by accident.
        if: steps.cert.outputs.have_cert != 'true'
        timeout-minutes: 15
        run: |
          app/mac/script/make-dmg.sh app/mac/build/SWE.app "$RUNNER_TEMP/SWE.dmg"
          mkdir -p app/mac/build/macos-app
          printf 'Unsigned prod build: MACOS_CERTIFICATE is not configured.\n' \
            > app/mac/build/macos-app/UNSIGNED.txt

      - name: Build the Sparkle appcast
        if: steps.cert.outputs.have_cert == 'true'
        timeout-minutes: 10
        env:
          GH_REPO: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The release needs SPARKLE_PRIVATE_KEY, the EdDSA key matching SUPublicEDKey in the app; Sparkle rejects unsigned enclosures."
            exit 1
          fi
          # Sparkle's own generator writes the appcast for the archives in
          # a folder; the version pins to what the app links (Package.swift)
          # so the enclosure signature matches SUPublicEDKey. The zip's
          # SHA-256 is pinned too — it runs next, with SPARKLE_PRIVATE_KEY
          # on its stdin, so a swapped upstream asset must not reach it.
          tools="$RUNNER_TEMP/sparkle"
          mkdir -p "$tools"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip" \
            -o "$tools/sparkle.zip"
          echo "17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959  $tools/sparkle.zip" \
            | shasum -a 256 -c -
          ditto -x -k "$tools/sparkle.zip" "$tools"
          chmod +x "$tools/bin/"*
          # --ed-key-file - reads the key from stdin, so the secret never
          # sits on the runner's argv or in a file.
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$tools/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/" \
            app/mac/build/macos-app
          xmllint --noout app/mac/build/macos-app/appcast.xml

      - name: Upload the app artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: app/mac/build/macos-app/
          if-no-files-found: error

      - name: Drop the signing keychain
        # The runner is disposable, but the keychain holds the release
        # private key, so take it down anyway.
        if: always() && steps.cert.outputs.have_cert == 'true'
        run: |
          security default-keychain -s login.keychain
          security delete-keychain "$RUNNER_TEMP/swe-signing.keychain-db" || true

  nix:
    # Not on PRs: the derivation's checkPhase runs the same unittest suite
    # ci.yml already runs, so per PR it only repeated a 6-minute job.  On a
    # tag it proves the flake still builds before anything is attached.
    name: Nix flake build and check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build the package (runs the unittest suite in the sandbox)
        run: nix build --print-build-logs

      - name: Exercise the built binary
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" ./result/bin/swe --help
          HOME="$test_home" ./result/bin/swe init --check

      - name: nix flake check
        run: nix flake check --print-build-logs

  macos-check:
    # The macOS install verification ci.yml used to run on every PR as
    # `macos-smoke`, relocated with the rest of the native lane (issue
    # #749).  On the tag it checks the shipping artifact rather than an
    # editable install: the built wheel installed into a clean venv,
    # exercised from /tmp so src/ cannot shadow it, then the path_health
    # unittest only a Darwin box can run for real — the Darwin-only paths
    # behind the Homebrew npm probe, the Cursor state.vscdb location and
    # the Claude Desktop config path.
    name: Verify the wheel on macOS
    needs: build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install the built wheel and run it
        # Same gate the `build` job applies on Linux: a clean venv,
        # commands run from /tmp against a throwaway HOME so a missing
        # packaged module or broken entry point fails the tag build.
        run: |
          python3 -m venv /tmp/relcheck
          /tmp/relcheck/bin/pip install dist/swe-*.whl
          test_home="$(mktemp -d)"
          cd /tmp
          HOME="$test_home" /tmp/relcheck/bin/swe --help
          HOME="$test_home" /tmp/relcheck/bin/swe list
          HOME="$test_home" /tmp/relcheck/bin/swe session --help
          HOME="$test_home" /tmp/relcheck/bin/swe config --help
          HOME="$test_home" /tmp/relcheck/bin/swe report --help

      - name: Exercise macOS-sensitive paths
        # Runs against the installed wheel: `import swe` resolves to
        # site-packages because the src/ layout keeps the package out of
        # the checkout root's import path.
        run: |
          /tmp/relcheck/bin/python -m unittest discover -s tests -p 'test_path_health.py' -v

  attach-to-release:
    name: Attach artifacts to the GitHub release
    needs: [build, macos-app, nix, macos-check]
    runs-on: ubuntu-latest
    permissions:
      # Only this job gets a writable token, and only for release assets.
      contents: write
    outputs:
      # "true" only when a published release got a signed, versioned DMG:
      # the one case the Homebrew tap should follow.
      attached: ${{ steps.upload.outputs.attached }}

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download the macOS app artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-app
          path: macos-app/

      - name: Upload to the release, if one exists
        # Deliberately does not create the release.  If the maintainer has not
        # written the notes yet, this leaves a notice and the files stay on the
        # workflow run; re-running the workflow afterwards attaches them.
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # dist/ holds the sdist + wheel; macos-app/ holds the DMG and
          # appcast.xml, or just an UNSIGNED notice when the signing
          # secrets are not configured.  The glob picks up real assets only.
          shopt -s nullglob
          # A stable-named copy of the versioned DMG, so
          # releases/latest/download/SWE.dmg is a permanent download
          # link. It is made here, after the appcast, so Sparkle only ever
          # lists the versioned file.
          versioned=(macos-app/SWE-*.dmg)
          if [ "${#versioned[@]}" -eq 1 ]; then
            cp "${versioned[0]}" macos-app/SWE.dmg
          fi
          assets=(dist/* macos-app/*.dmg macos-app/appcast*.xml)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            echo "Attached ${assets[*]} to release $RELEASE_TAG"
            if [ "${#versioned[@]}" -eq 1 ]; then
              echo "attached=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::No published GitHub release for $RELEASE_TAG yet. Publish the release, then re-run this workflow to attach the artifacts."
          fi

  homebrew-tap-gate:
    # Decides whether this run may move c-wenlong/homebrew-quiver. Kept
    # out of the bump job's concurrency group on purpose: a re-run for an
    # older tag stops here instead of queueing, where it would replace
    # (and so cancel) the newest release's pending bump.
    #
    # The tap follows only a signed DMG on a published release (the
    # `attached` output), and only the latest release.
    #
    # Required secret: HOMEBREW_TAP_TOKEN, a fine-grained token with
    # Contents read/write on c-wenlong/homebrew-quiver only. Without it
    # this leaves a notice and the tap stays as it is.
    name: Check whether the Homebrew tap should follow
    needs: attach-to-release
    if: needs.attach-to-release.outputs.attached == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.gate.outputs.go }}

    steps:
      - name: Check the token and that this is the latest release
        id: gate
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap stays on its current version."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `gh release view` with no tag is the latest published release,
          # never a draft or prerelease. A manual re-run for an older tag
          # must not roll the tap back.
          latest="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest" != "$RELEASE_TAG" ]; then
            echo "::notice::$RELEASE_TAG is not the latest release ($latest); the Homebrew tap stays as it is."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

  bump-homebrew-tap:
    # Points the tap at this release: the `quiver` cask at the DMG, the
    # `swe` formula at the wheel.
    name: Bump the Homebrew tap
    needs: homebrew-tap-gate
    if: needs.homebrew-tap-gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One tap bump at a time, so two pushes never race. Only latest-
    # release runs get here, and bump_tap.py refuses to move the tap to
    # an older version, so the tap ends on the newest whatever the order.
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          sparse-checkout: scripts/bump_tap.py
          sparse-checkout-cone-mode: false

      - name: Hash the uploaded DMG and wheel
        # Hashes what the release now serves, the bytes `brew` will fetch,
        # rather than the copies this run uploaded.
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          dir="$RUNNER_TEMP/assets"
          gh release download "$RELEASE_TAG" --dir "$dir" \
            --pattern "SWE-$version.dmg" \
            --pattern "swe-$version-py3-none-any.whl"
          echo "dmg=$(sha256sum "$dir/SWE-$version.dmg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "wheel=$(sha256sum "$dir/swe-$version-py3-none-any.whl" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Push the bump to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          DMG_SHA: ${{ steps.sha.outputs.dmg }}
          WHEEL_SHA: ${{ steps.sha.outputs.wheel }}
        run: |
          tap="$RUNNER_TEMP/homebrew-quiver"
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/c-wenlong/homebrew-quiver.git" "$tap"
          python3 scripts/bump_tap.py "$tap" "$RELEASE_TAG" "$DMG_SHA" "$WHEEL_SHA"
          cd "$tap"
          if git diff --quiet; then
            echo "The tap already points at $RELEASE_TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "quiver ${RELEASE_TAG#v}" \
            -m "Bumped by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin HEAD:main

