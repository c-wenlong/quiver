[project]
site_name = "Quiver"
site_url = "https://c-wenlong.github.io/quiver/"
site_description = "Quiver / swe: one registry, shared instructions and session history for every AI coding CLI on your machine."
repo_url = "https://github.com/c-wenlong/quiver"
docs_dir = "build/docs-site"
site_dir = "site"

nav = [
  { "Overview" = "overview.md" },
  { "CLI reference" = "cli.md" },
  { "Harness support" = "harness-support.md" },
  { "macOS app" = [
      { "Overview" = "app/index.md" },
      { "Roadmap" = "app/roadmap.md" },
      { "Architecture" = "app/architecture.md" },
      { "Coding plans" = "app/coding-plans.md" },
  ] },
  { "Architecture" = [
      { "Overview" = "architecture/index.md" },
      { "Backend architecture" = "architecture/backend-architecture.md" },
      { "Data model" = "architecture/data-model.md" },
      { "JSON contracts" = "architecture/json-contracts.md" },
  ] },
  { "Contributing" = [
      { "Overview" = "contributing/index.md" },
      { "Testing" = "contributing/testing.md" },
      { "Coverage" = "contributing/coverage.md" },
      { "Guide for coding agents" = "contributing/agents.md" },
      { "Security" = "contributing/security.md" },
      { "Support" = "contributing/support.md" },
      { "Code of conduct" = "contributing/code-of-conduct.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

markdown_extensions = [
  "admonition",
  "attr_list",
  "md_in_html",
  "footnotes",
  "pymdownx.details",
  "pymdownx.superfences",
  "pymdownx.tasklist",
]

[project.theme]
logo = "app/Icons/AppIcon-light.png"
favicon = "app/Icons/AppIcon-light.png"
features = [
  "navigation.tabs",
  "navigation.instant",
  "navigation.top",
  "content.code.copy",
]

# Palette toggle: follow the OS, with manual light/dark overrides.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.validation]
invalid_links = true
invalid_link_anchors = true
