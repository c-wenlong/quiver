name: QuiverRemote
options:
  bundleIdPrefix: com.quiver
targets:
  QuiverRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/QuiverRemote
      - path: Assets.xcassets
    info:
      path: QuiverRemote-Info.plist
      properties:
        CFBundleDisplayName: Quiver Remote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Without a UILaunchScreen dict iOS letterboxes the app to a legacy
        # screen size (black bars top and bottom).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the pair QR that swe remote pair --app shows.
        CFBundleURLTypes:
          - CFBundleURLName: com.quiver.remote.pair
            CFBundleURLSchemes: [quiver]
        # The hub is plain HTTP on the tailnet, not TLS.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quiver.remote
        DEVELOPMENT_TEAM: MAK855QGSV
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
  QuiverRemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/QuiverRemoteTests
    dependencies:
      - target: QuiverRemote
    settings:
      base:
        DEVELOPMENT_TEAM: MAK855QGSV
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  QuiverRemote:
    build:
      targets:
        QuiverRemote: all
        QuiverRemoteTests: [test]
    test:
      targets:
        - QuiverRemoteTests
