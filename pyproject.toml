[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "swe"
version = "1.1.1"
description = "Central manager for AI coding CLI tools — one command to launch, resume, and analyze many AI coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Wenlong Chen", email = "c-wenlong@users.noreply.github.com" }]
keywords = ["ai", "cli", "coding-agents", "llm", "developer-tools", "mcp", "claude", "codex", "cursor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
# The core CLI is stdlib-only. tomllib is stdlib from 3.11, which is
# the floor, so there is nothing left to declare here.
dependencies = []

[project.optional-dependencies]
# `mcp_server.py` exposes session history as a FastMCP server; only needed if
# you run `python -m swe.mcp_server`. The core `swe` CLI is stdlib-only.
# mcp 2.x removed mcp.server.fastmcp, which mcp/server.py imports.
# 1.30.0 is the first 1.x release patched for GHSA-84m7-p3x7-pcfv.
server = ["mcp>=1.30.0,<2"]
# mistune renders the generated docs pages under app/landing-page/; the
# freshness test in tests/test_docs_site.py imports it through
# scripts/docs_site.py. Docs-only, never a runtime dep. Pinned to the
# same release as docs/requirements.txt: the freshness check compares
# rendered HTML byte for byte, so generator and test must agree.
test = ["coverage[toml]>=7.10", "mistune==3.3.4"]

[project.scripts]
swe = "swe.cli:main"

[project.urls]
Homepage = "https://github.com/c-wenlong/quiver"
Documentation = "https://github.com/c-wenlong/quiver#readme"
Repository = "https://github.com/c-wenlong/quiver"
Issues = "https://github.com/c-wenlong/quiver/issues"
Changelog = "https://github.com/c-wenlong/quiver/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/swe", "src/quiver"]

[tool.hatch.build.targets.sdist]
# The native apps (app/mac, app/ios) are built from the repo, not shipped on PyPI.
exclude = ["app/"]
