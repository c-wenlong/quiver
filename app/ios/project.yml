name: SWERemote
options:
  bundleIdPrefix: com.swe
# The console's SSH and terminal. Exact versions: Package.resolved isn't
# checked in (it lives in the generated project), so a range would let
# every regenerate pick up a newer SSH stack unreviewed.
packages:
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    exactVersion: 2.102.0
  SwiftNIOSSH:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.0
  # 1.12 and later add a Metal renderer, which needs Xcode's separate
  # Metal Toolchain download to build; 1.11.2 draws with CoreGraphics.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
targets:
  SWERemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SWERemote
      - path: Assets.xcassets
    dependencies:
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftNIO
        product: NIOConcurrencyHelpers
      - package: SwiftNIOSSH
        product: NIOSSH
      - package: SwiftTerm
        product: SwiftTerm
      - target: SWEShare
      - target: SWEWidget
    info:
      path: SWERemote-Info.plist
      properties:
        CFBundleDisplayName: SWE Remote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        # Without a UILaunchScreen dict iOS letterboxes the app to a legacy
        # screen size (black bars top and bottom).
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The shared Keychain group, read by SharedContainer. The build
        # fills in the signing team, so no team id is in the source.
        SWEKeychainGroup: $(AppIdentifierPrefix)com.swe.remote.shared
        NSCameraUsageDescription: Scan the pair QR that swe remote pair --app shows.
        CFBundleURLTypes:
          - CFBundleURLName: com.swe.remote.pair
            # `swe` is what new hubs emit; `quiver` keeps pair, session
            # and issue links written before the rename opening.
            CFBundleURLSchemes: [swe, quiver]
        # The hub is plain HTTP on the tailnet, not TLS, and its address
        # can only take a few shapes: a MagicDNS name (always *.ts.net —
        # the one named exception), or a tailnet CGNAT IP, unqualified/
        # .local name or IP literal typed by hand — NSAllowsLocalNetworking
        # covers those (NSExceptionDomains matches DNS names, so an IP
        # range can't be listed there). Residual scope: HTTP to *.ts.net
        # plus local names and IP literals; arbitrary domains still get
        # full ATS.
        NSAppTransportSecurity: &ats
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    # The App Group holds the hub list and the shared Keychain group the
    # hubs' credentials, so the share extension and the widget can read
    # the paired hubs (KeychainHubStore). Signing with automatic style
    # registers both on the team's App IDs.
    entitlements:
      path: SWERemote.entitlements
      properties: &sharedGroups
        com.apple.security.application-groups: [group.com.swe.remote]
        keychain-access-groups: [$(AppIdentifierPrefix)com.swe.remote.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swe.remote
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # Members come only from modules a file imports itself. Without it,
        # Charts (imported by the Usage chart) leaks its overloads into
        # every file and ChatView's arithmetic stops type-checking in time.
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  # The share sheet (#1441): text, links, images and files from any app
  # into a session. It compiles the app's hub files itself (the store,
  # the client, the wire types, the attachment rules and the share
  # logic) rather than a framework, and reads the paired hubs from the
  # same App Group and Keychain group as the app.
  SWEShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SWEShare
      - path: Sources/SWERemote/Share
      - path: Sources/SWERemote/Hub/Pairing.swift
      - path: Sources/SWERemote/Hub/HubStore.swift
      - path: Sources/SWERemote/Hub/HubClient.swift
      - path: Sources/SWERemote/Hub/Models.swift
      - path: Sources/SWERemote/Hub/Attachments.swift
      # Wire types HubClient's other routes name.
      - path: Sources/SWERemote/Hub/PullActions.swift
      - path: Sources/SWERemote/Hub/PagePreview.swift
      - path: Sources/SWERemote/Hub/SSHTarget.swift
      - path: Sources/SWERemote/Hub/UsageModels.swift
      - path: Sources/SWERemote/Hub/UsageFormat.swift
    info:
      path: SWEShare-Info.plist
      properties:
        CFBundleDisplayName: SWE
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        SWEKeychainGroup: $(AppIdentifierPrefix)com.swe.remote.shared
        NSAppTransportSecurity: *ats
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
    entitlements:
      path: SWEShare.entitlements
      properties: *sharedGroups
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swe.remote.share
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  # The home screen widget (#1442): what needs you, what's working and
  # today's spend. Same pattern as the share sheet: it compiles the app's
  # hub files and the shared widget logic (Sources/SWERemote/Widget),
  # and reads the paired hubs and the snapshot the app writes from the
  # same App Group and Keychain group.
  SWEWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SWEWidget
      - path: Sources/SWERemote/Widget
      - path: Sources/SWERemote/Hub/Pairing.swift
      - path: Sources/SWERemote/Hub/HubStore.swift
      - path: Sources/SWERemote/Hub/HubClient.swift
      - path: Sources/SWERemote/Hub/Models.swift
      - path: Sources/SWERemote/Hub/Attachments.swift
      # Wire types HubClient's other routes name.
      - path: Sources/SWERemote/Hub/PullActions.swift
      - path: Sources/SWERemote/Hub/PagePreview.swift
      - path: Sources/SWERemote/Hub/SSHTarget.swift
      - path: Sources/SWERemote/Hub/UsageModels.swift
      - path: Sources/SWERemote/Hub/UsageFormat.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: SWEWidget-Info.plist
      properties:
        CFBundleDisplayName: SWE
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        SWEKeychainGroup: $(AppIdentifierPrefix)com.swe.remote.shared
        NSAppTransportSecurity: *ats
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SWEWidget.entitlements
      properties: *sharedGroups
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swe.remote.widget
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  SWERemoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SWERemoteTests
    dependencies:
      - target: SWERemote
      - package: SwiftNIOSSH
        product: NIOSSH
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
  SWERemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SWERemoteUITests
    dependencies:
      - target: SWERemote
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: SWERemote
schemes:
  SWERemote:
    build:
      targets:
        SWERemote: all
        SWERemoteTests: [test]
        SWERemoteUITests: [test]
    test:
      targets:
        - SWERemoteTests
        - SWERemoteUITests
